    ; ~/.config/polybar/config.ini
    [colors]
    background = #e6282828
    background-alt = #3c3836
    foreground = #ebdbb2
    primary = #458588
    secondary = #b16286
    alert = #fb4934
    disabled = #7c6f64

    [bar/example]
    width = 100%
    height = 48pt
    radius = 8

    background = ${colors.background}
    foreground = ${colors.foreground}

    line-size = 2pt

    border-size = 4pt
    border-color = #00000000

    padding-left = 0
    padding-right = 3

    module-margin = 0

    separator = |
    separator-foreground = ${colors.disabled}

    font-0 = "CaskaydiaCove Nerd Font:size=16;2"
    font-1 = "Font Awesome 6 Free:style=Solid:size=16;2"
    font-2 = "Font Awesome 6 Brands:style=Regular:size=16;2"
    font-3 = "CaskaydiaCove Nerd Font:size=26;2"

    modules-left = i3
    modules-center = date
    modules-right = pulseaudio memory cpu wlan eth battery

    cursor-click = pointer
    cursor-scroll = ns-resize

    enable-ipc = true

    ; Systray
    tray-position = right
    tray-padding = 2
    tray-maxsize = 16
    tray-background = ${colors.background}

    [module/i3]
    type = internal/i3
    pin-workspaces = true
    strip-wsnumbers = true
    index-sort = true
    enable-click = true
    enable-scroll = true
    wrapping-scroll = false
    fuzzy-match = true

    ws-icon-0 = "1;" 
    ws-icon-1 = "2;"
    ws-icon-2 = "3;" 
    ws-icon-3 = "4;" 
    ws-icon-4 = "5;" 
    ws-icon-default = "" 

    label-focused = %index%
    label-focused-foreground = ${colors.foreground}
    label-focused-background = ${colors.background-alt}
    label-focused-underline= ${colors.primary}
    label-focused-padding = 2
    label-focused-margin = 0

    label-unfocused = %index%
    label-unfocused-padding = 2
    label-unfocused-margin = 0

    label-urgent = %index%
    label-urgent-background = ${colors.alert}
    label-urgent-padding = 2
    label-urgent-margin = 0

    label-visible = %index%
    label-visible-underline = #555555
    label-visible-padding = 2
    label-visible-margin = 0

    [module/xwindow]
    type = internal/xwindow
    label = %title:0:60:...%

    [module/pulseaudio]
    type = internal/pulseaudio
    format-volume-prefix = "  "
    format-volume-prefix-foreground = ${colors.primary}
    format-volume = <label-volume>
    label-volume = %percentage%%
    label-muted =  muted
    label-muted-foreground = ${colors.disabled}

    [module/memory]
    type = internal/memory
    interval = 2
    format-prefix = " "
    format-prefix-foreground = ${colors.primary}
    label = %percentage_used:2%%

    [module/cpu]
    type = internal/cpu
    interval = 2
    format-prefix = " "
    format-prefix-foreground = ${colors.primary}
    label = %percentage:2%%

    [network-base]
    format-prefix = " "
    format-prefix-foreground = ${colors.primary}
    type = internal/network
    interval = 5
    format-connected = <label-connected>
    format-disconnected = <label-disconnected>
    label-disconnected = %{F#F0C674}%ifname%%{F-} disconnected

    [module/wlan]
    inherit = network-base
    interface = wlo1
    label-connected = %{F#458588}  %{F-}%essid%

    [module/eth]
    inherit = network-base
    interface = enxf8e43be7e1ed
    label-connected = %{F#458588}  %{F-} %ifname%

    [module/date]
    type = internal/date
    interval = 1
    date = %H:%M
    date-alt = %Y-%m-%d %H:%M:%S

    format = <label>
    label = %{F#458588}%{T3}%{F-} %{T1}%date%%{T-}
    label-foreground = ${colors.foreground}
    label-background = ${colors.background-alt}
    label-padding = 6
    label-margin = 2
    label-font = 3

    format-prefix = " "
    format-prefix-foreground = ${colors.disabled}
    format-suffix = " "
    format-suffix-foreground = ${colors.disabled}

    [module/battery]
    type = internal/battery
    battery = BAT0
    adapter = AC
    full-at = 98

    format-charging = <animation-charging> <label-charging>
    format-discharging = <ramp-capacity> <label-discharging>
    format-full = <ramp-capacity> <label-full>

    label-charging = %percentage%%
    label-discharging = %percentage%%
    label-full = %percentage%%

    ramp-capacity-0 = 
    ramp-capacity-1 = 
    ramp-capacity-2 = 
    ramp-capacity-3 = 
    ramp-capacity-4 = 

    animation-charging-0 = 
    animation-charging-1 = 
    animation-charging-2 = 
    animation-charging-3 = 
    animation-charging-4 = 

    [settings]
    screenchange-reload = true
    pseudo-transparency = false
